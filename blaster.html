<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Blaster</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #05060d; color: #eef1ff; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; user-select: none;
  }
  .wrap { position: relative; }
  .hud {
    position: absolute; top: -46px; left: 0; right: 0;
    display: flex; justify-content: space-between; font-weight: 700; font-size: 14px;
    color: #9aa3c7;
  }
  .hud b { color: #7c4dff; }
  canvas { display: block; border-radius: 12px; border: 2px solid #2c3457; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; background: rgba(5,6,13,.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 20px;
  }
  .overlay h1 { font-size: 44px; background: linear-gradient(135deg,#7c4dff,#ff3d81); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay p { color: #9aa3c7; max-width: 360px; line-height: 1.5; }
  button {
    background: linear-gradient(135deg,#7c4dff,#304ffe); color: #fff; border: 0;
    padding: 13px 34px; border-radius: 999px; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  button:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>WAVE <b id="wave">1</b></span>
      <span>LIVES <b id="lives">❤❤❤</b></span>
    </div>
    <canvas id="c" width="480" height="600"></canvas>
  </div>

  <div class="overlay" id="ov">
    <h1 id="title">🚀 Space Blaster</h1>
    <p id="text">Move with ← → or mouse / touch. Fire with Space or tap. Destroy every invader before they reach you!</p>
    <button id="go">Launch</button>
  </div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let ship, bullets, enemies, stars, score, lives, wave, running = false, spawnT = 0, fireT = 0, keys = {}, mouseX = null;

function reset() {
  ship = {x: cv.width/2, y: cv.height-60, w: 46, h: 26, cd: 0};
  bullets = []; enemies = []; score = 0; lives = 3; wave = 1; spawnT = 0;
  stars = Array.from({length: 90}, () => ({x: Math.random()*cv.width, y: Math.random()*cv.height, s: Math.random()*2+.4, v: Math.random()*60+30}));
  updateHud();
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('lives').textContent = '❤'.repeat(Math.max(0,lives)) || '—';
}

const COLORS = ['#ff3d81','#ffb300','#00d67d','#00b0ff'];
function spawnEnemy() {
  const size = 34;
  enemies.push({
    x: 30 + Math.random()*(cv.width-60), y: -40,
    w: size, h: size, speed: 40 + wave*8 + Math.random()*30,
    hp: wave > 3 && Math.random() < .3 ? 2 : 1,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    drift: (Math.random()-.5)*40
  });
}

function boom(x, y, color, n = 14) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, sp = Math.random()*160+40;
    particles.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: .6, color});
  }
}
let particles = [];

function hit(a, b) {
  return a.x - a.w/2 < b.x + b.w/2 && a.x + a.w/2 > b.x - b.w/2 &&
         a.y - a.h/2 < b.y + b.h/2 && a.y + a.h/2 > b.y - b.h/2;
}

let last = 0;
function loop(t) {
  if (!running) return;
  const dt = Math.min(0.05, (t - last)/1000); last = t;
  const W = cv.width, H = cv.height;

  // stars
  stars.forEach(s => { s.y += s.v*dt; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });

  // ship move
  if (mouseX !== null) ship.x += (mouseX - ship.x) * Math.min(1, dt*14);
  if (keys.ArrowLeft || keys.a) ship.x -= 340*dt;
  if (keys.ArrowRight || keys.d) ship.x += 340*dt;
  ship.x = Math.max(26, Math.min(W-26, ship.x));

  // fire
  ship.cd -= dt;
  if ((keys[' '] || keys.Space) && ship.cd <= 0) {
    bullets.push({x: ship.x, y: ship.y-18, w: 6, h: 14, v: -560});
    ship.cd = 0.22;
  }

  bullets.forEach(b => b.y += b.v*dt);
  bullets = bullets.filter(b => b.y > -20);

  // spawn
  spawnT -= dt;
  if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.35, 1.3 - wave*0.08); }

  enemies.forEach(e => { e.y += e.speed*dt; e.x += e.drift*dt; if (e.x<20||e.x>W-20) e.drift*=-1; });
  wave = 1 + Math.floor(score/250);
  updateHud();

  // collisions
  enemies.forEach(e => {
    bullets.forEach(b => {
      if (b.dead || e.dead) return;
      if (hit(b, e)) {
        b.dead = true; e.hp--;
        boom(e.x, e.y, e.color, 6);
        if (e.hp <= 0) { e.dead = true; score += 25; boom(e.x, e.y, e.color); }
      }
    });
    if (!e.dead && hit(e, ship)) {
      e.dead = true; lives--; boom(ship.x, ship.y, '#00b0ff', 26); updateHud();
      if (lives <= 0) return end();
    }
    if (!e.dead && e.y > H + 30) { e.dead = true; lives--; updateHud(); if (lives <= 0) return end(); }
  });
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  particles.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);

  // draw
  ctx.fillStyle = '#05060d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#9fb3ff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s*2));

  ctx.shadowColor = '#00b0ff'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#00b0ff';
  ctx.beginPath();
  ctx.moveTo(ship.x, ship.y-16);
  ctx.lineTo(ship.x-22, ship.y+14);
  ctx.lineTo(ship.x-8, ship.y+8);
  ctx.lineTo(ship.x, ship.y+14);
  ctx.lineTo(ship.x+8, ship.y+8);
  ctx.lineTo(ship.x+22, ship.y+14);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,179,0,.85)';
  ctx.beginPath(); ctx.ellipse(ship.x, ship.y+16, 5, 8+Math.random()*5, 0, 0, 7); ctx.fill();

  ctx.fillStyle = '#ffe14d'; ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 10;
  bullets.forEach(b => ctx.fillRect(b.x-3, b.y-8, 6, 16));
  ctx.shadowBlur = 0;

  enemies.forEach(e => {
    ctx.fillStyle = e.color; ctx.shadowColor = e.color; ctx.shadowBlur = 12;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(e.x-e.w/2, e.y-e.h/2, e.w, e.h, 8);
    else ctx.rect(e.x-e.w/2, e.y-e.h/2, e.w, e.h);
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#05060d';
    ctx.fillRect(e.x-9, e.y-5, 6, 6); ctx.fillRect(e.x+3, e.y-5, 6, 6);
    if (e.hp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
  });

  particles.forEach(p => { ctx.globalAlpha = Math.max(0,p.life/0.6); ctx.fillStyle = p.color; ctx.fillRect(p.x-2, p.y-2, 4, 4); });
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

function end() {
  running = false;
  document.getElementById('title').textContent = '💥 Game Over';
  document.getElementById('text').textContent = `You reached wave ${wave} and scored ${score} points.`;
  document.getElementById('go').textContent = 'Retry';
  document.getElementById('ov').classList.remove('hidden');
  const b = +(localStorage.getItem('pz_blaster_best') || 0);
  if (score > b) localStorage.setItem('pz_blaster_best', score);
}

function start() {
  document.getElementById('ov').classList.add('hidden');
  reset(); running = true; last = performance.now();
  requestAnimationFrame(loop);
}

document.getElementById('go').onclick = start;
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if (e.key === ' ') keys[' '] = true;
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; if (e.key === ' ') keys[' '] = false; });

cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (cv.width / r.width);
});
cv.addEventListener('pointerdown', e => { keys[' '] = true; cv.setPointerCapture?.(e.pointerId); });
cv.addEventListener('pointerup', () => keys[' '] = false);

reset();
ctx.fillStyle = '#05060d'; ctx.fillRect(0,0,cv.width,cv.height);
</script>
</body>
</html>
