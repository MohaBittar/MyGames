<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; background: linear-gradient(160deg,#160d2e,#0d0f1a 60%);
    color: #eef1ff; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; font-family: system-ui, sans-serif; padding: 24px;
  }
  h1 { font-size: 32px; background: linear-gradient(135deg,#ff6d00,#ff3d81); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud { display: flex; gap: 26px; font-weight: 700; color: #9aa3c7; font-size: 15px; }
  .hud b { color: #ff6d00; }
  .board {
    display: grid; gap: 10px;
    grid-template-columns: repeat(4, minmax(64px, 96px));
    perspective: 800px;
  }
  .card {
    aspect-ratio: 1; position: relative; cursor: pointer;
    transform-style: preserve-3d; transition: transform .4s;
  }
  .card.flipped, .card.done { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; font-size: clamp(26px, 6vw, 40px);
  }
  .back {
    background: linear-gradient(135deg,#7c4dff,#304ffe);
    border: 2px solid #4950a8; color: rgba(255,255,255,.5);
  }
  .front {
    background: #1b2138; border: 2px solid #2c3457;
    transform: rotateY(180deg);
  }
  .card.done .front { border-color: #00d67d; background: #12291f; }
  button {
    background: linear-gradient(135deg,#ff6d00,#bf360c); color: #fff; border: 0;
    padding: 12px 30px; border-radius: 999px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  button:hover { transform: scale(1.05); }
  .win {
    background: rgba(0,214,125,.12); border: 1px solid #00d67d;
    padding: 12px 22px; border-radius: 12px; font-weight: 700; color: #00d67d;
  }
  @media (max-width: 480px) { .board { grid-template-columns: repeat(4, minmax(56px, 1fr)); width: 100%; } }
</style>
</head>
<body>
  <h1>🧠 Memory Match</h1>
  <div class="hud">
    <span>Moves <b id="moves">0</b></span>
    <span>Time <b id="time">0s</b></span>
    <span>Pairs <b id="pairs">0/8</b></span>
  </div>
  <div class="board" id="board"></div>
  <div class="win hidden" id="win"></div>
  <button id="restart">↻ New game</button>

<script>
const EMOJIS = ['🍕','🚀','🐶','🎧','🌵','⚽','🎲','🍩'];
const board = document.getElementById('board');
let first = null, lock = false, moves = 0, matched = 0, seconds = 0, timer = null;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateHud() {
  document.getElementById('moves').textContent = moves;
  document.getElementById('pairs').textContent = matched + '/8';
  document.getElementById('time').textContent = seconds + 's';
}

function newGame() {
  clearInterval(timer);
  first = null; lock = false; moves = 0; matched = 0; seconds = 0;
  document.getElementById('win').classList.add('hidden');
  updateHud();
  timer = setInterval(() => { seconds++; updateHud(); }, 1000);

  const deck = shuffle([...EMOJIS, ...EMOJIS]);
  board.innerHTML = '';
  deck.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.innerHTML = '<div class="face back">❔</div><div class="face front">' + emoji + '</div>';
    card.onclick = () => flip(card);
    board.appendChild(card);
  });
}

function flip(card) {
  if (lock || card.classList.contains('flipped') || card.classList.contains('done')) return;
  card.classList.add('flipped');

  if (!first) { first = card; return; }

  moves++;
  if (first.dataset.emoji === card.dataset.emoji) {
    first.classList.add('done'); card.classList.add('done');
    first = null; matched++;
    updateHud();
    if (matched === 8) win();
  } else {
    lock = true;
    const a = first, b = card;
    first = null;
    setTimeout(() => { a.classList.remove('flipped'); b.classList.remove('flipped'); lock = false; }, 750);
    updateHud();
  }
}

function win() {
  clearInterval(timer);
  const best = +(localStorage.getItem('pz_mem_best') || 0);
  if (!best || moves < best) localStorage.setItem('pz_mem_best', moves);
  const el = document.getElementById('win');
  el.textContent = `🎉 Solved in ${moves} moves and ${seconds}s! Best: ${localStorage.getItem('pz_mem_best')} moves`;
  el.classList.remove('hidden');
}

document.getElementById('restart').onclick = newGame;
newGame();
</script>
</body>
</html>
