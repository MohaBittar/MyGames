<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Block Dodge</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #07080f; color: #eef1ff; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; user-select: none;
  }
  .wrap { position: relative; }
  .hud {
    position: absolute; top: -46px; left: 0; right: 0;
    display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: #9aa3c7;
  }
  .hud b { color: #00b0ff; }
  canvas { display: block; border-radius: 12px; border: 2px solid #2c3457; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; background: rgba(7,8,15,.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 20px;
  }
  .overlay h1 { font-size: 44px; color: #00b0ff; text-shadow: 0 0 24px rgba(0,176,255,.6); }
  .overlay p { color: #9aa3c7; max-width: 340px; line-height: 1.5; }
  button {
    background: linear-gradient(135deg,#00b0ff,#01579b); color: #fff; border: 0;
    padding: 13px 34px; border-radius: 999px; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  button:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
  .pad { display: flex; gap: 10px; margin-top: 14px; }
  .pad button { padding: 14px 30px; font-size: 20px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
    <canvas id="c" width="360" height="560"></canvas>
    <div class="pad">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
  </div>

  <div class="overlay" id="ov">
    <h1 id="title">🧱 Block Dodge</h1>
    <p id="text">Move with ← → or A/D (drag works too). Dodge the falling blocks — the longer you survive, the faster it gets.</p>
    <button id="go">Start</button>
  </div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let player, blocks, score, speed, spawnT, running = false, keys = {}, dragging = false, last = 0, particles = [];
document.getElementById('best').textContent = localStorage.getItem('pz_dodge_best') || 0;

function reset() {
  player = {x: cv.width/2, y: cv.height-60, w: 46, h: 26};
  blocks = []; score = 0; speed = 180; spawnT = 0; particles = [];
}

function spawn() {
  const w = 34 + Math.random()*56;
  blocks.push({
    x: Math.random()*(cv.width - w), y: -40, w, h: 26 + Math.random()*20,
    v: speed + Math.random()*90, hue: 190 + Math.random()*60
  });
}

function boom(x, y) {
  for (let i=0;i<24;i++) {
    const a = Math.random()*Math.PI*2, sp = Math.random()*220+60;
    particles.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: .8});
  }
}

function loop(t) {
  if (!running) return;
  const dt = Math.min(0.05, (t-last)/1000); last = t;
  const W = cv.width, H = cv.height;

  if (!dragging) {
    if (keys.ArrowLeft || keys.a) player.x -= 380*dt;
    if (keys.ArrowRight || keys.d) player.x += 380*dt;
  }
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(0.28, 0.9 - score/600); }

  blocks.forEach(b => b.y += b.v*dt);

  score += dt * 10;
  speed = 180 + score * 1.4;
  document.getElementById('score').textContent = Math.floor(score);

  for (const b of blocks) {
    if (Math.abs(b.x + b.w/2 - player.x) < (b.w + player.w)/2 - 6 &&
        Math.abs(b.y + b.h/2 - player.y) < (b.h + player.h)/2 - 4) {
      return end();
    }
  }
  blocks = blocks.filter(b => b.y < H + 60);

  particles.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);

  ctx.fillStyle = '#07080f'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(0,176,255,.08)';
  for (let x=0; x<W; x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }

  blocks.forEach(b => {
    ctx.fillStyle = `hsl(${b.hue} 90% 55%)`;
    ctx.shadowColor = `hsl(${b.hue} 90% 55%)`; ctx.shadowBlur = 12;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 7);
    else ctx.rect(b.x, b.y, b.w, b.h);
    ctx.fill(); ctx.shadowBlur = 0;
  });

  ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(player.x - player.w/2, player.y - player.h/2, player.w, player.h, 9);
  else ctx.rect(player.x - player.w/2, player.y - player.h/2, player.w, player.h);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#00b0ff';
  ctx.fillRect(player.x - 10, player.y - 5, 20, 10);

  particles.forEach(p => { ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = '#00b0ff'; ctx.fillRect(p.x-3,p.y-3,6,6); });
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

function end() {
  running = false;
  boom(player.x, player.y);
  const s = Math.floor(score);
  const best = +(localStorage.getItem('pz_dodge_best') || 0);
  if (s > best) localStorage.setItem('pz_dodge_best', s);
  document.getElementById('title').textContent = '💥 Crashed!';
  document.getElementById('text').textContent = `You survived for ${s} points. Best: ${Math.max(s, best)}.`;
  document.getElementById('go').textContent = 'Try again';
  document.getElementById('ov').classList.remove('hidden');
}

function start() {
  document.getElementById('ov').classList.add('hidden');
  reset(); running = true; last = performance.now();
  requestAnimationFrame(loop);
}

document.getElementById('go').onclick = start;
addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });

const toCanvasX = e => {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) * (cv.width / r.width);
};
cv.addEventListener('pointerdown', e => { dragging = true; player.x = toCanvasX(e); cv.setPointerCapture?.(e.pointerId); });
cv.addEventListener('pointermove', e => { if (dragging) player.x = toCanvasX(e); });
cv.addEventListener('pointerup', () => dragging = false);

document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k === 'left' ? 'ArrowLeft' : 'ArrowRight';
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});

reset();
</script>
</body>
</html>
