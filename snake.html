<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #07080f; color: #eef1ff; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; user-select: none; overflow: hidden;
  }
  .hud { display: flex; gap: 24px; margin-bottom: 12px; font-weight: 700; font-size: 15px; }
  .hud span b { color: #00d67d; }
  canvas { border: 2px solid #2c3457; border-radius: 12px; background: #0d0f1a; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; background: rgba(7,8,15,.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 20px;
  }
  .overlay h1 { font-size: 42px; color: #00d67d; }
  .overlay p { color: #9aa3c7; max-width: 340px; line-height: 1.5; }
  button {
    background: linear-gradient(135deg,#00c853,#004d40); color: #fff; border: 0;
    padding: 13px 34px; border-radius: 999px; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  button:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; margin-top: 16px; }
  .pad button { padding: 14px 0; font-size: 18px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="hud">SCORE <b id="score">0</b> &nbsp;•&nbsp; BEST <b id="best">0</b> &nbsp;•&nbsp; SPEED <b id="spd">1</b></div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="pad">
    <span></span><button data-k="ArrowUp">▲</button><span></span>
    <button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button>
  </div>

  <div class="overlay" id="ov">
    <h1 id="ovTitle">🐍 Neon Snake</h1>
    <p id="ovText">Use arrow keys / WASD or the buttons. Eat glowing orbs, grow, and don't hit the walls or yourself.</p>
    <button id="startBtn">Play</button>
  </div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, CELL = cv.width / N;
let snake, dir, nextDir, food, score, best = +(localStorage.getItem('pz_snake_best') || 0), timer = null, speed = 140, alive;

document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; speed = 140; alive = true;
  placeFood();
  document.getElementById('score').textContent = 0;
  document.getElementById('spd').textContent = 1;
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x===head.x && s.y===head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    speed = Math.max(70, 140 - Math.floor(score/50)*8);
    document.getElementById('spd').textContent = Math.round((140/speed)*10)/10;
    clearInterval(timer); timer = setInterval(tick, speed);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle = 'rgba(44,52,87,.4)';
  for (let i=1;i<N;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(cv.width,i*CELL); ctx.stroke();
  }
  // food
  const t = Date.now()/200;
  const r = CELL*0.32 + Math.sin(t)*2;
  ctx.fillStyle = '#ff3d81'; ctx.shadowColor = '#ff3d81'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, r, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  // snake
  snake.forEach((s,i) => {
    const f = 1 - i/snake.length*0.55;
    ctx.fillStyle = i===0 ? '#00ff9d' : `rgba(0,200,83,${f})`;
    ctx.shadowColor = '#00c853'; ctx.shadowBlur = i===0 ? 14 : 0;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, 6);
    else ctx.rect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4);
    ctx.fill(); ctx.shadowBlur = 0;
  });
}

function gameOver() {
  alive = false; clearInterval(timer);
  if (score > best) { best = score; localStorage.setItem('pz_snake_best', best); document.getElementById('best').textContent = best; }
  document.getElementById('ovTitle').textContent = '💀 Game Over';
  document.getElementById('ovText').textContent = `You scored ${score} points.`;
  document.getElementById('startBtn').textContent = 'Play again';
  document.getElementById('ov').classList.remove('hidden');
}

function start() {
  document.getElementById('ov').classList.add('hidden');
  reset(); draw(); clearInterval(timer); timer = setInterval(tick, speed);
}

document.getElementById('startBtn').onclick = start;

addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const map = {arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};
  if (map[k]) {
    e.preventDefault();
    const d = map[k];
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }
});

document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('click', () => {
    const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    const d = map[b.dataset.k];
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  });
});

reset(); draw();
</script>
</body>
</html>
